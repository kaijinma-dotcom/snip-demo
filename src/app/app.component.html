<div class="page">
  <header class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <h1 class="hero-title">Snip</h1>
    <p class="hero-sub">Paste a long link. Get a short one.</p>
  </header>

  <section class="input-wrap">
    <form class="pill-form" (ngSubmit)="submit()">
      <input
        class="pill-input"
        type="url"
        placeholder="https://paste-your-url-here.com"
        [ngModel]="urlInput()"
        (ngModelChange)="urlInput.set($event)"
        name="url"
        autocomplete="off"
      />
      <button class="pill-btn" type="submit" [disabled]="loading()">
        {{ loading() ? '…' : 'Shorten' }}
      </button>
    </form>
  </section>

  @if (shortUrl()) {
    <div class="notice notice--success">
      <span class="notice-label">Short link</span>
      <a [href]="shortUrl()" target="_blank" rel="noopener" class="notice-link">{{ shortUrl() }}</a>
    </div>
  }

  @if (errorMsg()) {
    <div class="notice notice--error">{{ errorMsg() }}</div>
  }

  @if (links().length > 0) {
    <section class="card links-card">
      <table class="links-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Original URL</th>
            <th>Hits</th>
          </tr>
        </thead>
        <tbody>
          @for (link of links(); track link.code) {
            <tr>
              <td><a [href]="link.shortUrl" target="_blank" rel="noopener" class="code-link">{{ link.code }}</a></td>
              <td class="url-cell">{{ link.url }}</td>
              <td class="hits-cell">{{ link.hits }}</td>
            </tr>
          }
        </tbody>
      </table>
    </section>
  }
</div>
